<!doctype html>
{% load static %}

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Buy Now - MobileMart</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <style>
      .buy-now-page {
        width: 100%;
        min-height: 600px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 20px;
        box-sizing: border-box;
      }

      .buy-now-card {
        width: 700px;
        background: white;
        padding: 45px;
        border-radius: 18px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        text-align: center;
        box-sizing: border-box;
      }

      .buy-now-image {
        width: 220px;
        height: 260px;
        object-fit: contain;
        margin-bottom: 20px;
      }

      .buy-now-card h1 {
        font-size: 32px;
        margin: 10px 0;
      }

      .buy-now-card h2 {
        font-size: 30px;
        margin: 20px 0;
      }

      .buy-now-card p {
        color: #555;
        font-size: 17px;
      }

      .buy-now-card button {
        width: 80%;
        padding: 15px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 17px;
        cursor: pointer;
        margin-top: 20px;
      }

      .buy-now-card button:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">📱 MobileMart</div>

      <div class="menu">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'mobiles' %}">Mobiles</a>
        <a href="{% url 'brands' %}">Brands</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>
      </div>

      <a href="{% url 'cart' %}" class="cart"> 🛒 Cart </a>
    </nav>

    <section class="buy-now-page">
      <div class="buy-now-card">
        {% if mobile.image %}
        <img
          src="{% static 'images/' %}{{ mobile.image }}"
          alt="{{ mobile.name }}"
          class="buy-now-image"
        />
        {% endif %}

        <h1>{{ mobile.name }}</h1>

        <p>Brand: {{ mobile.brand.name }}</p>

        <h2>₹{{ mobile.price }}</h2>

        <p>🚚 Free Delivery</p>

        <button type="button" id="pay-button">⚡ Buy Now & Pay</button>
      </div>
    </section>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
      var options = {
        key: "{{ key_id }}",

        amount: "{{ amount }}",

        currency: "INR",

        name: "MobileMart",

        description: "{{ mobile.name }}",

        order_id: "{{ order.id }}",

        handler: function (response) {
          var form = document.createElement("form");

          form.method = "POST";
          form.action = "{% url 'verify_payment' %}";

          var csrf = document.createElement("input");

          csrf.type = "hidden";
          csrf.name = "csrfmiddlewaretoken";
          csrf.value = "{{ csrf_token }}";

          form.appendChild(csrf);

          var orderId = document.createElement("input");

          orderId.type = "hidden";
          orderId.name = "razorpay_order_id";
          orderId.value = response.razorpay_order_id;

          form.appendChild(orderId);

          var paymentId = document.createElement("input");

          paymentId.type = "hidden";
          paymentId.name = "razorpay_payment_id";
          paymentId.value = response.razorpay_payment_id;

          form.appendChild(paymentId);

          var signature = document.createElement("input");

          signature.type = "hidden";
          signature.name = "razorpay_signature";
          signature.value = response.razorpay_signature;

          form.appendChild(signature);

          document.body.appendChild(form);

          form.submit();
        },
      };

      var rzp1 = new Razorpay(options);

      document.getElementById("pay-button").onclick = function (e) {
        rzp1.open();

        e.preventDefault();
      };
    </script>
  </body>
</html>
